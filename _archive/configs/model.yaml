model:
  path: "Vehicle_dect_may1.pt"
  conf_threshold: 0.55
  iou_threshold: 0.45
  imgsz: 640
  device: "auto"
  half: true

# 🔥 USE YOLO CLASS HERE
alert_classes:
  - ambulance

all_classes:
  - car
  - truck
  - bike
  - bus
  - others
  - ambulance
  - car_fall

tracking:
  enabled: true
  method: "bytetrack"
  min_frames_before_alert: 3

colors:
  car:       [144, 238, 144]
  truck:     [173, 216, 230]
  bike:      [255, 255, 153]
  bus:       [255, 182, 193]
  others:    [221, 160, 221]
  ambulance: [0, 80, 255]
  default:   [200, 200, 200]